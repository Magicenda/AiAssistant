name: ai-assistant

services:
  postgres:
    image: postgres:15
    container_name: ai-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: ai-assistant-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Единый .env монорепы; файла может не быть — тогда работают значения ниже
      - path: ./.env
        required: false
    environment:
      # Внутри compose-сети база доступна по имени сервиса, а не по localhost:5434
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/ai_assistant}
      # Ollama / LM Studio, запущенные на хосте, доступны из контейнера так
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      # environment приоритетнее env_file; значение ниже — только для локальной
      # разработки. Свой секрет задавайте в корневом .env или переменной окружения.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Аудиофайлы TTS/транскрибации переживают перезапуск контейнера
      - ./apps/api/storage:/app/storage
      # Кэш моделей Whisper, чтобы не скачивать их при каждом старте
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  web:
    build:
      context: ./apps/web
      args:
        # Инлайнится в бандл при сборке. Для прода в .env укажите внешний адрес
        # nginx, например https://ai.example.com — тогда браузер ходит в /api
        # того же домена. После изменения значения web нужно пересобрать.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ai-assistant-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(3000) }).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Единственная публичная точка входа в production. Локально web и api
  # остаются доступны на 127.0.0.1 для отладки, наружу смотрит только nginx.
  nginx:
    image: nginx:stable-alpine
    container_name: ai-assistant-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      # В проде обычно 80; HTTP_PORT меняется, если 80 занят или стоит
      # внешний TLS-прокси.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  whisper-cache:
