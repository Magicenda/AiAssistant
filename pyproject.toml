[project]
name = "aiassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "edge-tts>=7.3.1",
    "fastapi[standard]>=0.148.0",
    "faster-whisper>=1.2.1",
    "gigachat>=0.2.3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

[project.scripts]
aiassistant = "aiassistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
