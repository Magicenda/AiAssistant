# Публичная точка входа для production: отдаёт frontend и проксирует API.
# Контейнеры web и api доступны снаружи только на 127.0.0.1, а nginx
# обращается к ним внутри compose-сети по именам сервисов.

# Docker DNS переразрешает имена при каждом запросе: после пересоздания
# контейнера api/web nginx не держит устаревший IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# Заголовки для WebSocket/HTTP Upgrade, если они появятся у приложений.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Если TLS терминируется внешним прокси, сохраняем исходную схему запроса.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # Аудио для распознавания речи приходит multipart-запросом.
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Проверка живости самого nginx для healthcheck контейнера.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend: /api/... уходит в api:8000 без изменения пути.
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (/api/llm/query/stream) и потоковое аудио (/api/voice/stream)
        # должны уходить в браузер сразу, без накопления в буфере nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend: все остальные пути обслуживает Next.js.
    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
